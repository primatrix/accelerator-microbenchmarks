# One-pod rank-3 batched matmul sweep for MXU scheduling analysis on v7x.
#
# MB remains inside one Pallas program.  Each case gets its own JAX subprocess
# and JF dump directory, while all cases reuse this single TPU allocation.
name: tensorcore-mxu-batched-final-bundle-v7x-sweep
exp_type: PROFILING
artifact_type: operator-profile
cluster_name: tpu-training-antgroup
profile: true
tags: [profile, operator-optimization, pallas, mxu-reverse-engineering, batched-matmul]
model_version: tensorcore-mxu-batched-final-bundle-v1
config: '{"operation":"batched_[MB,M,K]x[MB,K,N]","cases":[[1,16,256,256],[2,16,256,256],[3,16,256,256],[4,16,256,256],[8,16,256,256],[1,32,256,256],[2,32,256,256],[4,32,256,256],[1,64,128,128],[2,64,128,128],[4,64,128,128]],"program_count_per_case":1,"falcon_pod_count":1,"dump":"jf_text_annotated_final_mxu_bundle","input":"bf16","accumulator":"fp32","output":"bf16","correctness_required":false}'
role_to_task_spec:
  worker:
    replica: 1
    image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.9.0-rev1
    device_count: 8
    device_type: v7x
    device_topo: 2x2x1
    envs:
      MXU_WARMUP: "0"
      MXU_REPEAT: "1"
      MXU_CASE_TIMEOUT_SECONDS: "600"
      MXU_EXPORT_HOLD_SECONDS: "900"
      MXU_BATCHED_LLO_DUMP_ROOT: /tmp/tpu_logs/mxu-batched-llo-dumps
      MXU_SOURCE_REPOSITORY: https://github.com/primatrix/accelerator-microbenchmarks.git
      MXU_SOURCE_REF: codex/mxu-behavior-modeling
      TMPDIR: /tmp/tpu_logs/tmp
      PIP_CACHE_DIR: /tmp/tpu_logs/pip-cache
      UV_CACHE_DIR: /tmp/tpu_logs/uv-cache
      PYTHONUNBUFFERED: "1"
    command: |
      set -eu
      ulimit -c 0
      mkdir -p "$TMPDIR" "$PIP_CACHE_DIR" "$UV_CACHE_DIR"

      SOURCE_ROOT=/tmp/tpu_logs/accelerator-microbenchmarks
      ARTIFACT_ROOT="${ARTIFACT_LOCAL_DIR:-/tmp/tensorcore-mxu-batched-artifact}"
      EXPORT_ARCHIVE=/tmp/tpu_logs/mxu-batched-final-bundles.tar.gz
      EXPORT_RELEASE=/tmp/tpu_logs/mxu-batched-export.release
      export JAX_COMPILATION_CACHE_DIR=/tmp/tpu_logs/jax-compilation-cache
      mkdir -p "$JAX_COMPILATION_CACHE_DIR" "$ARTIFACT_ROOT"

      git clone --depth 1 --branch "$MXU_SOURCE_REF" \
        "$MXU_SOURCE_REPOSITORY" "$SOURCE_ROOT"
      export MXU_SOURCE_COMMIT
      MXU_SOURCE_COMMIT="$(git -C "$SOURCE_ROOT" rev-parse HEAD)"

      python3 -m pip install --no-cache-dir --upgrade "jax[tpu]==0.10.2"

      python3 "$SOURCE_ROOT/Ironwood/src/benchmark_tensorcore_batched_pallas_sweep.py" \
        --case 1,16,256,256 \
        --case 2,16,256,256 \
        --case 3,16,256,256 \
        --case 4,16,256,256 \
        --case 8,16,256,256 \
        --case 1,32,256,256 \
        --case 2,32,256,256 \
        --case 4,32,256,256 \
        --case 1,64,128,128 \
        --case 2,64,128,128 \
        --case 4,64,128,128 \
        --warmup "$MXU_WARMUP" \
        --repeat "$MXU_REPEAT" \
        --case-timeout-seconds "$MXU_CASE_TIMEOUT_SECONDS" \
        --artifact-dir "$ARTIFACT_ROOT" \
        --export-archive "$EXPORT_ARCHIVE" \
        --export-hold-seconds "$MXU_EXPORT_HOLD_SECONDS" \
        --export-release-file "$EXPORT_RELEASE"
